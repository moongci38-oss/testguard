name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm test

  # 자기 자신에게 적용한다 — 우리가 우리 테스트를 약하게 만들면 우리가 잡힌다.
  self:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # ⚠️ contents: read 가 반드시 함께 있어야 한다. `permissions:` 블록은 기본 권한 집합을
    #    **대체**하므로, pull-requests 만 적으면 contents 가 사라져 체크아웃이
    #    "Repository not found" 로 죽는다(2026-09-10 실측, private 레포에서 재현).
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
