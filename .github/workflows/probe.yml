name: Probe continue-on-error
on: pull_request
jobs:
  step_level_bad_ref:
    runs-on: ubuntu-latest
    steps:
      - uses: moongci38-oss/testguard@v999-does-not-exist
        continue-on-error: true
  job_level_bad_ref:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: moongci38-oss/testguard@v999-does-not-exist
  step_level_runtime_fail:
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        continue-on-error: true
